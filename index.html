<!DOCTYPE html>
<html>
<head>
<title>For You ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  text-align:center;
  font-family:Arial;
  background:linear-gradient(135deg,#ff9a9e,#fad0c4);
  margin:0;
  overflow:hidden;
}

#startScreen{
  position:fixed;
  width:100%;
  height:100%;
  background:#ff9a9e;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:26px;
  color:white;
  z-index:10;
}

#mainContent{
  display:none;
  padding:20px;
}

h1{color:white;}

img{
  width:200px;
  height:200px;
  border-radius:20px;
  object-fit:cover;
  box-shadow:0 0 20px pink;
}

button{
  padding:12px 20px;
  font-size:16px;
  margin:10px;
  border-radius:10px;
  border:none;
}

#yes{background:#ff4d6d;color:white;}
#no{background:grey;color:white;position:absolute;}

.heart{
  position:fixed;
  animation:float 5s linear infinite;
}

@keyframes float{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div id="startScreen" onclick="startSite()">
  Tap anywhere for a surprise 💖
</div>

<!-- MUSIC -->
<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<!-- MAIN CONTENT -->
<div id="mainContent">

<h1>Nandani 💖<br>Will you be my Valentine?</h1>

<img src="her.jpg"><br>

<button id="yes" onclick="yesClicked()">Yes 💕</button>
<button id="no" ontouchstart="moveNo()" onmouseover="moveNo()">No 😢</button>

</div>

<script>

function startSite(){
  let music=document.getElementById("bgMusic");

  music.currentTime = 70; // 🎵 Start at 1 minute
  music.play();

  document.getElementById("startScreen").style.display="none";
  document.getElementById("mainContent").style.display="block";
}

function yesClicked(){
  document.body.innerHTML=
  "<h1 style='color:white;margin-top:40%;'>Yayyy 💖<br>You made me the happiest 😍<br>Thank you for existing!!</h1>";
}

function moveNo(){
  let btn=document.getElementById("no");
  btn.style.top=Math.random()*80+"%";
  btn.style.left=Math.random()*80+"%";
}

setInterval(()=>{
  let heart=document.createElement("div");
  heart.innerHTML="💗";
  heart.className="heart";
  heart.style.left=Math.random()*100+"vw";
  heart.style.fontSize=(20+Math.random()*20)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),5000);
},400);

</script>

</body>
</html>
